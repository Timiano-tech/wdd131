<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lazy Loading</title>
    <link rel="stylesheet" href="styles/lazyload.css">
</head>
<body>
    <h1>Lazy Loading Example</h1>
    <p>Scroll down to see the lazy loaded image.</p>

    <picture><img src="https://picsum.photos/seed/bridge/400/600" alt="Mountain bridge scenery" loading="lazy"></picture>
    <picture><img src="https://picsum.photos/seed/forest/400/600" alt="Forest path landscape" loading="lazy"></picture>
    <picture><img src="https://picsum.photos/seed/ocean/400/600" alt="Ocean coastline view" loading="lazy"></picture>
    <picture><img src="https://picsum.photos/seed/desert/400/600" alt="Desert dunes at sunset" loading="lazy"></picture>
    <picture><img src="https://picsum.photos/seed/city/400/600" alt="City skyline at night" loading="lazy"></picture>
    <picture><img src="https://picsum.photos/seed/fields/400/600" alt="Open countryside fields" loading="lazy"></picture>

    <footer>
        <p>&copy; 2026 Lazy Loading Gallery</p>
    </footer>

</html>
